services:
  workspace:
    build:
      context: ../..
      dockerfile: capstone/deploy/Dockerfile
    image: agents-course-capstone:production
    environment:
      CAPSTONE_PUBLIC_ORIGIN: https://${CAPSTONE_DOMAIN:?Set CAPSTONE_DOMAIN to the public DNS hostname}
      CAPSTONE_ALLOW_REGISTRATION: ${CAPSTONE_ALLOW_REGISTRATION:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
    volumes:
      - workspace-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
  proxy:
    image: caddy:2-alpine
    environment:
      CAPSTONE_DOMAIN: ${CAPSTONE_DOMAIN:?Set CAPSTONE_DOMAIN to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      workspace:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
volumes:
  workspace-data:
  caddy-data:
  caddy-config:
