services:
  workspace:
    build:
      context: ../..
      dockerfile: capstone/deploy/Dockerfile
    image: agents-course-capstone:local
    ports:
      - "127.0.0.1:${CAPSTONE_PORT:-8080}:8080"
    environment:
      CAPSTONE_PUBLIC_ORIGIN: ${CAPSTONE_PUBLIC_ORIGIN:-http://localhost:8080}
      CAPSTONE_ALLOW_REGISTRATION: ${CAPSTONE_ALLOW_REGISTRATION:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
    volumes:
      - workspace-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  workspace-data:
